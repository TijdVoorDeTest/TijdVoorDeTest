framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
        excluded_patterns:
            - '*/assets/styles/_*.scss'
            - '*/assets/styles/**/_*.scss'
            - '*/assets/**/*_test.ts'
            - '*/assets/types/*.d.ts'
        missing_import_mode: strict

sensiolabs_typescript:
    # Listed explicitly instead of the whole assets/ directory: SWC chokes on assets/vendor/chart.js, a directory
    # whose name ends in .js. Add new top-level .ts files here.
    source_dir:
        - '%kernel.project_dir%/assets/bootstrap.ts'
        - '%kernel.project_dir%/assets/molshoop.ts'
        - '%kernel.project_dir%/assets/quiz.ts'
        - '%kernel.project_dir%/assets/sentry.ts'
        - '%kernel.project_dir%/assets/stimulus.ts'
        - '%kernel.project_dir%/assets/translator.ts'
        - '%kernel.project_dir%/assets/controllers'

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
