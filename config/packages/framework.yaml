# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    enabled_locales: ['nl', 'en']
    set_locale_from_accept_language: true

    # Note that the session will be started ONLY if you read or write from it.
    session: true
    # shortcut for private IP address ranges of your proxy
    trusted_proxies: 'private_ranges'
    # x-forwarded-for is needed so the rate limiters key on the real client, not the ingress
    trusted_headers: [ 'x-forwarded-for', 'x-forwarded-proto' ]
    form:
        csrf_protection:
            enabled: true
        #esi: true
        #fragments: true
    rate_limiter:
        # Throttles guesses against the public season-code entry point (config/packages/security.yaml
        # handles throttling for the molshoop /login form separately).
        season_code:
            policy: sliding_window
            limit: 20
            interval: '1 minute'
        # Throttles the public self-registration endpoint to slow down automated
        # account creation and confirmation-email bombing.
        registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
        rate_limiter:
            season_code:
                limit: 3
            registration:
                limit: 3
