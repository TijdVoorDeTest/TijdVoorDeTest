{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tvdt.fullname" . }}
  labels:
    {{- include "tvdt.labels" . | nindent 4 }}
type: Opaque
data:
  app-secret: {{ required "secrets.appSecret (or secrets.existingSecret) is required" .Values.secrets.appSecret | b64enc | quote }}
  mailer-dsn: {{ .Values.secrets.mailerDsn | default "null://null" | b64enc | quote }}
  sentry-dsn: {{ .Values.secrets.sentryDsn | b64enc | quote }}
{{- end }}
