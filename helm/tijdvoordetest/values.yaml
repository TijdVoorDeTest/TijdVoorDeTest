# Default values for the Tijd voor de test chart (structure based on the API Platform 4.1 chart).
# Required: app.defaultUri, app.mailerSender, database.existingSecret, and secrets (existingSecret or appSecret).

# Sessions and the rate limiter's cache are stored on the pod's local filesystem,
# so keep this at 1 until those move to a shared store (e.g. PdoSessionHandler).
replicaCount: 1

image:
  repository: ghcr.io/tijdvoordetest/tijdvoordetest
  pullPolicy: IfNotPresent
  # Defaults to the chart's appVersion, which is set for published charts. Required when installing from git.
  # Also used for SENTRY_RELEASE (without the leading "v").
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

app:
  env: prod
  # Caddy listens on plain HTTP on this port, TLS terminates at the ingress.
  # Unprivileged so the www-data user doesn't need CAP_NET_BIND_SERVICE.
  port: 8080
  caddyGlobalOptions: ""
  # Required: public URL, used to generate absolute URLs outside of HTTP requests (e.g. emails sent from commands).
  defaultUri: ""
  # Required: From address for emails.
  mailerSender: ""
  sentryEnvironment: production
  # Additional non-secret environment variables, as a map.
  extraEnv: {}

# Application secrets. Either reference an existing Secret (recommended with GitOps, created with e.g. SealedSecrets,
# External Secrets or SOPS) containing the keys app-secret and mailer-dsn (sentry-dsn optional), or set the values
# below and the chart creates the Secret.
secrets:
  existingSecret: ""
  # Only used when existingSecret is empty.
  # Random string, e.g. `openssl rand -hex 32`.
  appSecret: ""
  # Symfony Mailer DSN, defaults to null://null (no mail sent).
  mailerDsn: ""
  sentryDsn: ""

# PostgreSQL connection. The chart doesn't create the database or its user. The user must be able to create
# tables (on PostgreSQL 15+ that includes CREATE on the public schema).
database:
  # Secret in the release namespace with a URL-encoded postgresql://user:password@host:port/dbname URI,
  # without query string (the chart appends serverVersion and charset for Doctrine).
  existingSecret: ""
  # Key in that Secret holding the URI.
  uriKey: uri
  serverVersion: "18"
  charset: utf8

# Runs doctrine:migrations:migrate in a Job before each install/upgrade (Helm hook, Argo CD PreSync),
# app pods themselves don't migrate.
migrations:
  enabled: true
  backoffLimit: 1
  activeDeadlineSeconds: 600

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  # www-data in the Debian-based prod image
  runAsUser: 33
  runAsGroup: 33
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  # e.g. cert-manager.io/cluster-issuer: letsencrypt
  annotations: {}
  hosts:
    - chart-example.local
  tls: false
  # Defaults to <fullname>-tls (e.g. created by cert-manager).
  tlsSecretName: ""

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

nodeSelector: {}

tolerations: []

affinity: {}
