name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PR runs are cancelled when superseded. A main run that is already
  # publishing (image, Helm chart, Sentry release) must finish, and GitHub keeps
  # at most one queued run per group, so a burst of merges still collapses to the
  # first and the latest commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Written by build-release only (mode=max, so it holds the shared frankenphp_base layers);
  # every other job just reads it.
  CACHE_REF: ghcr.io/tijdvoordetest/tijdvoordetest:buildcache

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      helm: ${{ steps.filter.outputs.helm }}
    steps:
      # Fails closed: only pull requests can skip anything, and only when every changed
      # file is on the explicit skip list. Any error or empty result runs everything.
      - name: Filter changed files
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          app=true
          helm=true
          if [[ "$EVENT" == "pull_request" ]] && files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename') && [[ -n "$files" ]]; then
            app=false
            helm=false
            while IFS= read -r f; do
              case "$f" in
                .github/workflows/ci.yml) app=true; helm=true ;;
                helm/*) helm=true ;;
                .github/dependabot.yml | .github/workflows/* | docs/* | .idea/* | .coderabbit.yaml | LICENSE | *.md) ;;
                *) app=true ;;
              esac
            done <<< "$files"
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "helm=$helm" >> "$GITHUB_OUTPUT"
          echo "app=$app helm=$helm"

  build:
    name: Build Dev Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: "!cancelled() && !startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.app != 'false'"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Docker images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        with:
          pull: true
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}-devbuild
            *.cache-from=type=registry,ref=${{ env.CACHE_REF }}
            *.cache-from=type=gha,scope=refs/heads/main-devbuild
            *.cache-to=type=gha,scope=${{github.ref}}-devbuild,mode=${{ github.event_name == 'pull_request' && 'min' || 'max' }}

  helm:
    name: Helm Lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: "!cancelled() && !startsWith(github.ref, 'refs/tags/') && needs.changes.outputs.helm != 'false'"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5
      - name: Lint chart
        run: helm lint --strict helm/tijdvoordetest -f helm/tijdvoordetest/ci/lint-values.yaml
      - name: Render chart
        run: helm template tvdt helm/tijdvoordetest -f helm/tijdvoordetest/ci/lint-values.yaml > /dev/null

  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Load Docker images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        with:
          load: true
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}-devbuild
            *.cache-from=type=registry,ref=${{ env.CACHE_REF }}
      - name: Start services
        run: docker compose up php database --wait --wait-timeout 180 --no-build
      - name: Check HTTP reachability
        run: curl -v --fail-with-body --retry 10 --retry-delay 3 --retry-connrefused --retry-all-errors http://localhost
      - name: Warm up dev cache
        run: docker compose exec -T php bin/console cache:warmup --env=dev
      - name: Lint Twig templates
        run: docker compose exec -T php bin/console lint:twig --format=github templates
      - name: Twig Coding Style
        run: docker compose exec -T php vendor/bin/twig-cs-fixer check
      - name: Coding Style
        run: docker compose exec -T php vendor/bin/php-cs-fixer check --diff --show-progress=none
      - name: TypeScript Formatting
        run: docker compose exec -T php deno fmt --check assets/
      - name: TypeScript Lint
        run: docker compose exec -T php deno lint assets/
      - name: Validator translations (new messages check)
        run: |
          new_messages=$(docker compose exec -T php bin/console translation:extract --dump-messages --domain=validators --ansi nl | grep -aP '^\s*\* ' | grep -aP '\x1b\[32m' | grep -oP "(?<=\x1b\[32m).*?(?=\x1b\[39m)" || true)
          if [ -n "$new_messages" ]; then
            echo "::error::New validator constraint messages found that aren't in translations/validators.nl.yaml yet:"
            echo "$new_messages" | while IFS= read -r msg; do echo "::error::  - $msg"; done
            exit 1
          fi
      - name: Translations
        run: |
          docker compose exec -T php bin/console translation:extract --force --format=yaml --sort=asc --domain=messages nl
          if ! git diff --exit-code -- translations; then
            echo "::error::Translations are out of date. Run 'just translations' and commit the changes."
            exit 1
          fi
      - name: TypeScript Type Check
        run: docker compose exec -T php deno check assets/
      - name: Static Analysis (PHPStan)
        run: docker compose exec -T php vendor/bin/phpstan analyse --no-progress --no-ansi --error-format=github
      - name: Rector
        run: docker compose exec -T php vendor/bin/rector process --dry-run --no-progress-bar --no-ansi

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    if: "!startsWith(github.ref, 'refs/tags/')"
    permissions:
      checks: write
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Load Docker images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        with:
          load: true
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}-devbuild
            *.cache-from=type=registry,ref=${{ env.CACHE_REF }}
      - name: Start services
        run: docker compose up php database --wait --wait-timeout 180 --no-build
      - name: Build SCSS
        run: docker compose exec -T php bin/console sass:build
      - name: Build TypeScript
        run: docker compose exec -T php bin/console typescript:build
      - name: TypeScript Tests
        run: docker compose exec -T php deno test assets/
      - name: Create test databases
        # The plain test database plus one per ParaTest worker (see bin/reload-test-dbs).
        run: docker compose exec -T php bin/reload-test-dbs
      - name: Run PHPUnit
        # Reports are written outside var/ since var/ is a Docker volume (see the Dockerfile's
        # VOLUME /app/var/) and isn't bind-mounted to the runner, unlike the rest of the project.
        run: docker compose exec -T php vendor/bin/paratest --log-junit reports/junit.xml
      - name: Publish PHPUnit test results
        if: always()
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6
        with:
          report_paths: reports/junit.xml
          check_name: PHPUnit
      - name: Doctrine Schema Validator
        run: docker compose exec -T php bin/console -e test doctrine:schema:validate

  build-release:
    name: Build and Release
    permissions:
      contents: read
      packages: write
    needs: [quality, tests, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    if: >-
      always() && !cancelled() && !failure() &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "git_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "git_commit_time=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            SENTRY_VERSION="tijdvoordetest@${TAG#[vV]}"
            {
              echo "tag=$TAG"
              echo "sentry_version=$SENTRY_VERSION"
              echo "chart_version=${TAG#[vV]}"
              echo "full_name=ghcr.io/${REPO_LOWER}:$TAG"
              echo "source_name=ghcr.io/${REPO_LOWER}:$(git rev-parse --short HEAD)"
            } >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(git rev-parse --short HEAD)
            {
              echo "tag=$SHORT_SHA"
              echo "sentry_version=tijdvoordetest@$SHORT_SHA"
              echo "chart_version=0.0.0-main.${{ github.run_number }}"
              echo "full_name=ghcr.io/${REPO_LOWER}:$SHORT_SHA"
            } >> "$GITHUB_OUTPUT"
          fi

      # A release is the commit CI already built on main, so retag that image instead of rebuilding.
      # The image only exists once build-release on main passed (it needs quality, tests and helm),
      # so waiting for it doubles as the "CI passed on this commit" gate.
      - name: Retag main image as release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SOURCE: ${{ steps.meta.outputs.source_name }}
          TARGET: ${{ steps.meta.outputs.full_name }}
        run: |
          for attempt in {1..40}; do
            docker buildx imagetools inspect "$SOURCE" >/dev/null 2>&1 && break
            if [[ $attempt -eq 40 ]]; then
              echo "::error::$SOURCE not found after 20 minutes. Push the commit to main and wait for CI to pass before tagging."
              exit 1
            fi
            echo "$SOURCE not published yet (attempt $attempt/40), waiting 30s..."
            sleep 30
          done
          docker buildx imagetools create --tag "$TARGET" "$SOURCE"

      - name: Build and Push Docker images
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7
        with:
          pull: true
          push: true
          files: |
            compose.yaml
            compose.build.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}-devbuild
            *.cache-from=type=registry,ref=${{ env.CACHE_REF }}
            *.cache-from=type=gha,scope=refs/heads/main-devbuild
            *.cache-to=type=registry,ref=${{ env.CACHE_REF }},mode=max,image-manifest=true,oci-mediatypes=true
            *.args.BUILD_TIME=${{ steps.meta.outputs.build_time }}
            *.args.GIT_SHA=${{ steps.meta.outputs.git_sha }}
            *.args.GIT_COMMIT_TIME=${{ steps.meta.outputs.git_commit_time }}
            *.tags=${{ steps.meta.outputs.full_name }}

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5

      - name: Publish Helm chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          CHART_VERSION: ${{ steps.meta.outputs.chart_version }}
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin
          helm package helm/tijdvoordetest --version "$CHART_VERSION" --app-version "$TAG"
          helm push "tijdvoordetest-${CHART_VERSION}.tgz" "oci://ghcr.io/${OWNER,,}/charts"

      - name: Create Sentry release
        uses: getsentry/action-release@e6703d0b00208e0b3687ba660d18ab5af7892821 # v3
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          release: ${{steps.meta.outputs.sentry_version}}
          environment: ${{ startsWith(github.ref, 'refs/tags/') && 'production' || 'acceptance' }}
